name: curling_scoreboard
description: A simple app to set up, track, and report the scoreboard for a game of curling.
publish_to: "none"
version: 0.9.0
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.50.0
dependencies:
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  # Not actually used, but needed to suppress warnings. Gets tree shaken out at build time.
  cupertino_icons: ^2.0.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  material_segmented_control: ^5.0.1
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  web: ^1.1.2
dev_dependencies:
  build_runner: ^2.16.2
  build_version: ^2.2.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  translations_cleaner: ^0.2.1
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  uses-material-design: true
