name: curling_scoreboard
description: A simple app to keep setup, track, and report the scoreboard of a game of curling.
publish_to: "none"
version: 0.0.40
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.44.8
dependencies:
  cloud_firestore: ^6.7.1
  # Not actually used, but needed to suppress warnings. Gets tree shaken out at build time.
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.5.4
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  material_segmented_control: ^5.0.1
  shared_preferences: ^2.3.0
dev_dependencies:
  build_runner: ^2.15.1
  build_version: ^2.1.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  translations_cleaner: ^0.2.1
  very_good_analysis: ^10.3.0
flutter:
  generate: true
  uses-material-design: true
