name: curling_scoreboard_flutter
description: A simple app to keep setup, track, and report the scoreboard of a game of curling.
publish_to: "none"
version: 0.0.34
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.44.0
dependencies:
  # Not actually used, but needed to suppress warnings. Gets tree shaken out at build time.
  cupertino_icons: ^1.0.9
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  material_segmented_control: ^5.0.1
  shared_preferences: ^2.3.0
dev_dependencies:
  build_runner: ^2.15.0
  build_version: ^2.1.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  translations_cleaner: ^0.1.1
  very_good_analysis: ^10.2.0
flutter:
  generate: true
  uses-material-design: true
