openapi: 3.1.0
info:
  title: Curling Scoreboard API
  version: 1.0.0
  description: |
    REST API for querying live and historical game data for registered curling clubs.

    All endpoints require a valid `X-API-Key` header. API keys are scoped per club —
    contact your club administrator to obtain one.

    The API can be called from any origin (CORS), so a web page can fetch it
    directly from the browser. A key used in browser code is visible to anyone who
    views the page; integrations that need to keep their key private should call
    the API from a server instead.

servers:
  - url: https://curling-scoreboard-prod.web.app/api/v1
    description: Production
  - url: https://curling-scoreboard-dev.web.app/api/v1
    description: Development

security:
  - ApiKeyAuth: []

tags:
  - name: Clubs
    description: Club-level information including all sheets and their live game status.
  - name: Sheets
    description: Individual sheet data with the current live game, if one is in progress.
  - name: Leagues
    description: A club's leagues and the teams in them.
  - name: Games
    description: Historical completed game records for a specific sheet.
  - name: Webhooks
    description: >-
      Requests this service sends to a URL the club sets in the admin portal.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per-club API key. Include in every request as the `X-API-Key` header.

  responses:
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Invalid API key

    RockColor:
      type: object
      description: >
        The color of rocks a team is throwing. Clubs choose their own two
        colors; red and yellow are the default. Recorded with each game, so
        it stays as it was if the club changes its rocks later.
      required: [name, hex]
      properties:
        name:
          type: string
          example: Red
        hex:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          example: '#F44336'

    LiveGameTeam:
      type: object
      required: [name, score, hasHammer]
      properties:
        name:
          type: string
          description: >
            In a league game, the team's name. Otherwise the name of its rock
            color as the club has set it, which is not always Red or Yellow.
          example: Red
        color:
          allOf:
            - $ref: '#/components/schemas/RockColor'
          description: Absent on games from scoreboards that predate it.
        teamId:
          type: string
          description: >
            League games only. The league team's ID, which stays the same if
            the team is renamed. See the Leagues endpoints.
          example: 4f9c2a71b3de
        externalId:
          type: string
          description: >
            League games only, and only when the club supplied one. The
            team's ID in the club's own league software.
          example: '1042'
        score:
          type: integer
          minimum: 0
          example: 3
        hasHammer:
          type: boolean
          description: Whether this team has last stone in the current end.
        hadLastStoneFirstEnd:
          type: boolean
          description: >
            Whether this team had last stone (hammer) in end 1. Fixed for the
            whole game, unlike hasHammer. Absent on games from scoreboards
            that predate it.

    GameLeague:
      type: object
      description: The league a game is part of, as it was named when the game started.
      required: [id, name]
      properties:
        id:
          type: string
          example: monday-night
        name:
          type: string
          example: Monday Night

    LeagueDraw:
      type: object
      description: One regular time a league plays each week, in the club's local time.
      required: [day, start, end]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: Day of the week, from 1 (Monday) to 7 (Sunday).
          example: 1
        start:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: 24 hour local time.
          example: '18:30'
        end:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '20:30'

    LeagueTeam:
      type: object
      required: [id, name, externalId]
      properties:
        id:
          type: string
          description: Stays the same if the team is renamed. Matches `teamId` on a game's teams.
          example: 4f9c2a71b3de
        name:
          type: string
          example: Team Smith
        externalId:
          type: [string, 'null']
          description: The team's ID in the club's own league software, if the club supplied one.
          example: '1042'

    League:
      type: object
      required: [id, name, active, seasonStart, seasonEnd, draws, teams]
      properties:
        id:
          type: string
          example: monday-night
        name:
          type: string
          example: Monday Night
        active:
          type: boolean
          description: Whether scoreboards currently offer this league when starting a game.
        seasonStart:
          type: [string, 'null']
          format: date
          description: First day of the season, or null if the club has not set one.
          example: '2026-10-05'
        seasonEnd:
          type: [string, 'null']
          format: date
          example: '2027-03-29'
        draws:
          type: array
          items:
            $ref: '#/components/schemas/LeagueDraw'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/LeagueTeam'

    LiveGame:
      type: object
      required: [updatedAt, currentEnd, league, team1, team2]
      properties:
        updatedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-10-08T19:42:11.000Z'
          description: >-
            When the scoreboard last wrote this game: at game start and on
            every score entry or edit. Null for a game started on a scoreboard
            build that predates this field.
        currentEnd:
          type: integer
          minimum: 1
          example: 5
        league:
          oneOf:
            - $ref: '#/components/schemas/GameLeague'
            - type: 'null'
          description: Null for an open game, which is not part of a league.
        team1:
          $ref: '#/components/schemas/LiveGameTeam'
        team2:
          $ref: '#/components/schemas/LiveGameTeam'

    Sheet:
      type: object
      required: [id, name, hasLiveGame, liveGame]
      properties:
        id:
          type: string
          example: sheet-1
        name:
          type: string
          example: Sheet 1
        hasLiveGame:
          type: boolean
          description: Convenience flag — true when liveGame is not null.
        liveGame:
          oneOf:
            - $ref: '#/components/schemas/LiveGame'
            - type: 'null'
          description: >-
            Current live game data, or null if no game is in progress. A game
            is live from the moment it is started, so the first end reports a
            0-0 score. A live game that has had no score change for 120
            minutes is treated as abandoned and reported as null.

    Club:
      type: object
      required: [id, name, sheets]
      properties:
        id:
          type: string
          example: windy-city-curling
        name:
          type: string
          example: Windy City Curling
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/Sheet'
          description: All sheets, ordered by name.

    GameTeam:
      type: object
      required: [name, totalScore, hadLastStoneFirstEnd]
      properties:
        name:
          type: string
          description: >
            In a league game, the team's name. Otherwise the name of its rock
            color as the club had set it, which is not always Red or Yellow.
          example: Red
        color:
          allOf:
            - $ref: '#/components/schemas/RockColor'
          description: Absent on games recorded before colors were.
        teamId:
          type: string
          description: >
            League games only. The league team's ID, which stays the same if
            the team is renamed. See the Leagues endpoints.
          example: 4f9c2a71b3de
        externalId:
          type: string
          description: >
            League games only, and only when the club supplied one. The
            team's ID in the club's own league software.
          example: '1042'
        totalScore:
          type: integer
          minimum: 0
          example: 8
        hadLastStoneFirstEnd:
          type: boolean
          description: Whether this team had last stone (hammer) in end 1.

    End:
      type: object
      required: [endNumber, scoringTeam, score, gameTimeInSeconds]
      properties:
        endNumber:
          type: integer
          minimum: 1
          example: 3
        scoringTeam:
          type: [string, 'null']
          description: |
            Name of the team that scored, or null for a blank end. Ambiguous when
            both teams share a name, so prefer `scoringTeamSlot` when it is present.
          example: Red
        scoringTeamSlot:
          type: [string, 'null']
          enum: [team1, team2, null]
          description: |
            Which team scored, or null for a blank end. Absent on games recorded
            before this field was added.
          example: team1
        score:
          type: integer
          minimum: 0
          example: 2
        gameTimeInSeconds:
          type: integer
          minimum: -1
          description: |
            Elapsed game time at the end of this end, in seconds. -1 on ends recorded
            before the game clock existed.
          example: 1620

    Game:
      type: object
      required: [id, startedAt, finishedAt, numberOfEnds, league, team1, team2, ends]
      properties:
        id:
          type: string
          example: abc123xyz
        startedAt:
          type: string
          format: date-time
          example: '2024-01-15T19:00:00.000Z'
        finishedAt:
          type: string
          format: date-time
          example: '2024-01-15T21:00:00.000Z'
        numberOfEnds:
          type: integer
          example: 8
        league:
          oneOf:
            - $ref: '#/components/schemas/GameLeague'
            - type: 'null'
          description: Null for an open game, and for games recorded before leagues were.
        team1:
          $ref: '#/components/schemas/GameTeam'
        team2:
          $ref: '#/components/schemas/GameTeam'
        ends:
          type: array
          items:
            $ref: '#/components/schemas/End'

    GameCompletedEvent:
      type: object
      required: [event, text, content, club, sheet, game]
      properties:
        event:
          type: string
          enum: [game.completed]
        text:
          type: string
          description: The result on one line. Slack shows this as the message.
          example: 'Monday Night, Sheet 1: Team Smith 7, Team Jones 4'
        content:
          type: string
          description: The same line as `text`. Discord shows this as the message.
          example: 'Monday Night, Sheet 1: Team Smith 7, Team Jones 4'
        club:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              example: windy-city-curling
            name:
              type: string
              example: Windy City Curling
        sheet:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              example: sheet-1
            name:
              type: string
              example: Sheet 1
        game:
          $ref: '#/components/schemas/Game'

webhooks:
  gameCompleted:
    post:
      summary: A game was completed
      description: |
        Sent to the club's webhook URL when Finish Game is tapped on one of its
        scoreboards. The club chooses in the admin portal whether every game is
        sent or only league games, where a league team was picked for at least
        one side.

        The URL must be `https` and publicly reachable. Any 2xx answer counts as
        delivered. No answer within 8 seconds, a 5xx or a 429 is tried twice
        more over a few seconds; anything else, including a redirect, is not
        tried again. A game is posted once, when the scoreboard's write arrives,
        so a scoreboard that was offline posts its games when it reconnects:
        use `game.finishedAt` for when the game ended.

        The admin portal's Send Test button posts `event: test` with `text`,
        `content` and `club` only.
      operationId: gameCompleted
      tags: [Webhooks]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCompletedEvent'
      responses:
        '2XX':
          description: The result was received.

paths:
  /clubs/{clubId}:
    get:
      summary: Get club
      description: |
        Returns the club's name and all sheets, each with their current live game status.
        Useful for building an overview display of all sheets in a club.
      operationId: getClub
      tags: [Clubs]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
      responses:
        '200':
          description: Club found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/leagues:
    get:
      summary: List leagues
      description: |
        Returns the club's leagues, ordered by name, each with its weekly schedule and teams.
        Inactive leagues are included, with `active` set to false.
      operationId: listLeagues
      tags: [Leagues]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
      responses:
        '200':
          description: The club's leagues. Empty if it has none.
          content:
            application/json:
              schema:
                type: object
                required: [leagues]
                properties:
                  leagues:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/leagues/{leagueId}:
    get:
      summary: Get league
      description: Returns a single league with its weekly schedule and teams.
      operationId: getLeague
      tags: [Leagues]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: leagueId
          in: path
          required: true
          description: Unique identifier for the league within the club.
          schema:
            type: string
          example: monday-night
      responses:
        '200':
          description: League found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or league not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/sheets/{sheetId}:
    get:
      summary: Get sheet
      description: |
        Returns a single sheet and its current live game, if one is in progress.
        Poll this endpoint to drive a real-time scoreboard display for a specific sheet.
      operationId: getSheet
      tags: [Sheets]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: sheetId
          in: path
          required: true
          description: Unique identifier for the sheet within the club.
          schema:
            type: string
          example: sheet-1
      responses:
        '200':
          description: Sheet found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sheet'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or sheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/sheets/{sheetId}/games:
    get:
      summary: List completed games
      description: |
        Returns completed games for a sheet, ordered most-recent first.
        Use the `limit` parameter to control how many records are returned (default 20, max 100).
      operationId: listGames
      tags: [Games]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: sheetId
          in: path
          required: true
          description: Unique identifier for the sheet within the club.
          schema:
            type: string
          example: sheet-1
        - name: limit
          in: query
          required: false
          description: Maximum number of games to return. Clamped to the range 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        '200':
          description: List of completed games.
          content:
            application/json:
              schema:
                type: object
                required: [games, limit]
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                  limit:
                    type: integer
                    description: The effective limit that was applied.
                    example: 20
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or sheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
