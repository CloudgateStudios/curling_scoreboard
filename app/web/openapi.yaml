openapi: 3.1.0
info:
  title: Curling Scoreboard API
  version: 1.0.0
  description: |
    REST API for querying live and historical game data for registered curling clubs.

    All endpoints require a valid `X-API-Key` header. API keys are scoped per club —
    contact your club administrator to obtain one.

    The API can be called from any origin (CORS), so a web page can fetch it
    directly from the browser. A key used in browser code is visible to anyone who
    views the page; integrations that need to keep their key private should call
    the API from a server instead.

servers:
  - url: https://curling-scoreboard-prod.web.app/api/v1
    description: Production
  - url: https://curling-scoreboard-dev.web.app/api/v1
    description: Development

security:
  - ApiKeyAuth: []

tags:
  - name: Clubs
    description: Club-level information including all sheets and their live game status.
  - name: Sheets
    description: Individual sheet data with the current live game, if one is in progress.
  - name: Leagues
    description: A club's leagues and the teams in them.
  - name: Bonspiels
    description: >-
      A club's bonspiels: their events, teams, draws and games, with who is in
      each game and how it went.
  - name: Games
    description: Historical completed game records for a specific sheet.
  - name: Webhooks
    description: >-
      Requests this service sends to a URL the club sets in the admin portal.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per-club API key. Include in every request as the `X-API-Key` header.

  responses:
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Invalid API key

    RockColor:
      type: object
      description: >
        The color of rocks a team is throwing. Clubs choose their own two
        colors; red and yellow are the default. Recorded with each game, so
        it stays as it was if the club changes its rocks later.
      required: [name, hex]
      properties:
        name:
          type: string
          example: Red
        hex:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          example: '#F44336'

    LiveGameTeam:
      type: object
      required: [name, score, hasHammer]
      properties:
        name:
          type: string
          description: >
            In a league game, the team's name. Otherwise the name of its rock
            color as the club has set it, which is not always Red or Yellow.
          example: Red
        color:
          allOf:
            - $ref: '#/components/schemas/RockColor'
          description: Absent on games from scoreboards that predate it.
        teamId:
          type: string
          description: >
            League games only. The league team's ID, which stays the same if
            the team is renamed. See the Leagues endpoints.
          example: 4f9c2a71b3de
        externalId:
          type: string
          description: >
            League games only, and only when the club supplied one. The
            team's ID in the club's own league software.
          example: '1042'
        score:
          type: integer
          minimum: 0
          example: 3
        hasHammer:
          type: boolean
          description: Whether this team has last stone in the current end.
        hadLastStoneFirstEnd:
          type: boolean
          description: >
            Whether this team had last stone (hammer) in end 1. Fixed for the
            whole game, unlike hasHammer. Absent on games from scoreboards
            that predate it.

    GameLeague:
      type: object
      description: The league a game is part of, as it was named when the game started.
      required: [id, name]
      properties:
        id:
          type: string
          example: monday-night
        name:
          type: string
          example: Monday Night

    GameBonspiel:
      type: object
      description: >-
        The bonspiel game a game was played as. `gameId` is a game's `id` in
        the bonspiel's plan, as the bonspiel endpoint returns it.
      required: [id, name, gameId]
      properties:
        id:
          type: string
          example: fall-spiel
        name:
          type: string
          example: Fall Spiel
        gameId:
          type: string
          example: g7Hq2

    LeagueDraw:
      type: object
      description: One regular time a league plays each week, in the club's local time.
      required: [day, start, end]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: Day of the week, from 1 (Monday) to 7 (Sunday).
          example: 1
        start:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: 24 hour local time.
          example: '18:30'
        end:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '20:30'

    LeagueTeam:
      type: object
      required: [id, name, externalId]
      properties:
        id:
          type: string
          description: Stays the same if the team is renamed. Matches `teamId` on a game's teams.
          example: 4f9c2a71b3de
        name:
          type: string
          example: Team Smith
        externalId:
          type: [string, 'null']
          description: The team's ID in the club's own league software, if the club supplied one.
          example: '1042'

    League:
      type: object
      required: [id, name, active, seasonStart, seasonEnd, draws, teams]
      properties:
        id:
          type: string
          example: monday-night
        name:
          type: string
          example: Monday Night
        active:
          type: boolean
          description: Whether scoreboards currently offer this league when starting a game.
        seasonStart:
          type: [string, 'null']
          format: date
          description: First day of the season, or null if the club has not set one.
          example: '2026-10-05'
        seasonEnd:
          type: [string, 'null']
          format: date
          example: '2027-03-29'
        draws:
          type: array
          items:
            $ref: '#/components/schemas/LeagueDraw'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/LeagueTeam'

    BonspielSummary:
      type: object
      required: [id, name, active, startDate, endDate]
      properties:
        id:
          type: string
          example: fall-spiel
        name:
          type: string
          example: Fall Spiel
        active:
          type: boolean
          description: Whether scoreboards offer the bonspiel's games on its dates.
        startDate:
          type: [string, 'null']
          format: date
          example: '2026-11-06'
        endDate:
          type: [string, 'null']
          format: date
          example: '2026-11-08'

    BonspielTeam:
      type: object
      required: [teamId, name]
      properties:
        teamId:
          type: [string, 'null']
          description: The team's `id` in the bonspiel, or null for a team a scoreboard named that is not in it.
          example: t3
        name:
          type: string
          example: Team Smith

    BonspielStanding:
      type: object
      required: [team, place, tied, played, wins, losses, ties, points]
      properties:
        team:
          $ref: '#/components/schemas/BonspielTeam'
        place:
          type: integer
          minimum: 1
          example: 1
        tied:
          type: boolean
          description: Whether the team shares its place with another.
        played:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        ties:
          type: integer
        points:
          type: integer
          description: Two for a win and one for a tie.

    BonspielEvent:
      type: object
      required: [id, name, numberOfEnds, finalGameId, winner, standings, complete]
      properties:
        id:
          type: string
          example: a
        name:
          type: string
          example: A Event
        numberOfEnds:
          type: [integer, 'null']
          description: The event's number of ends, or null to use the bonspiel's.
        finalGameId:
          type: [string, 'null']
          description: >-
            The event's final: its one game whose winner goes to no other game in
            it. Null for a pool, which has standings instead.
        winner:
          oneOf:
            - $ref: '#/components/schemas/BonspielTeam'
            - type: 'null'
          description: The final's winner, once it is played.
        standings:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/BonspielStanding'
          description: >-
            A pool's standings, best first: by points, then the points from the
            games between teams level on points, then the order the coordinator
            gave after a last stone draw or tiebreak game. Null for an event
            with a final.
        complete:
          type: [boolean, 'null']
          description: Whether every game in a pool has a result. Null for an event with a final.

    BonspielSideSource:
      type: object
      description: >-
        Where a side's team comes from: a team the coordinator placed, the
        winner or loser of another game, or a place in a pool's standings.
      required: [type]
      properties:
        type:
          type: string
          enum: [team, winner, loser, place]
        teamId:
          type: string
          description: For `team`.
        gameId:
          type: string
          description: For `winner` and `loser`.
        eventId:
          type: string
          description: For `place`, the pool.
        place:
          type: integer
          minimum: 1
          description: For `place`.

    BonspielGameSide:
      type: object
      required: [from, team, score]
      properties:
        from:
          oneOf:
            - $ref: '#/components/schemas/BonspielSideSource'
            - type: 'null'
          description: Null for a side still to be decided.
        team:
          oneOf:
            - $ref: '#/components/schemas/BonspielTeam'
            - type: 'null'
          description: The team on this side, once it is known.
        score:
          type: [integer, 'null']

    BonspielGame:
      type: object
      required: [id, label, drawId, sheetId, eventId, status, team1, team2, winner]
      properties:
        id:
          type: string
          example: g7Hq2
        label:
          type: string
          example: A7
        drawId:
          type: string
        sheetId:
          type: string
        eventId:
          type: string
        status:
          type: string
          enum: [waiting, ready, final]
          description: >-
            `waiting` until both teams are known, `ready` once they are, and
            `final` once the game has a result.
        team1:
          $ref: '#/components/schemas/BonspielGameSide'
        team2:
          $ref: '#/components/schemas/BonspielGameSide'
        winner:
          type: [string, 'null']
          enum: [team1, team2, null]
          description: Null until the game has a result, and for a tied game.

    Bonspiel:
      allOf:
        - $ref: '#/components/schemas/BonspielSummary'
        - type: object
          required: [numberOfEnds, events, teams, draws, games]
          properties:
            numberOfEnds:
              type: [integer, 'null']
              example: 8
            events:
              type: array
              items:
                $ref: '#/components/schemas/BonspielEvent'
            teams:
              type: array
              items:
                $ref: '#/components/schemas/LeagueTeam'
            draws:
              type: array
              items:
                type: object
                required: [id, label, start]
                properties:
                  id:
                    type: string
                  label:
                    type: string
                    example: Draw 5
                  start:
                    type: string
                    description: "'YYYY-MM-DDTHH:mm' in the club's local time."
                    example: '2026-11-07T09:00'
            games:
              type: array
              items:
                $ref: '#/components/schemas/BonspielGame'

    LiveGame:
      type: object
      required: [updatedAt, currentEnd, numberOfEnds, league, bonspiel, team1, team2, ends]
      properties:
        updatedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-10-08T19:42:11.000Z'
          description: >-
            When the scoreboard last wrote this game: at game start and on
            every score entry or edit. Null for a game started on a scoreboard
            build that predates this field.
        currentEnd:
          type: integer
          minimum: 1
          example: 5
        numberOfEnds:
          type: [integer, 'null']
          example: 8
          description: >-
            How many ends the game is scheduled for. Null for a game from a
            scoreboard build that predates this field.
        league:
          oneOf:
            - $ref: '#/components/schemas/GameLeague'
            - type: 'null'
          description: Null for an open game, which is not part of a league.
        bonspiel:
          oneOf:
            - $ref: '#/components/schemas/GameBonspiel'
            - type: 'null'
          description: Null for a game that is not part of a bonspiel.
        team1:
          $ref: '#/components/schemas/LiveGameTeam'
        team2:
          $ref: '#/components/schemas/LiveGameTeam'
        ends:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/End'
          description: >-
            The ends played so far, in the same form as a completed game's.
            Null for a game from a scoreboard build that predates this field.

    Sheet:
      type: object
      required: [id, name, hasLiveGame, liveGame]
      properties:
        id:
          type: string
          example: sheet-1
        name:
          type: string
          example: Sheet 1
        hasLiveGame:
          type: boolean
          description: Convenience flag — true when liveGame is not null.
        liveGame:
          oneOf:
            - $ref: '#/components/schemas/LiveGame'
            - type: 'null'
          description: >-
            Current live game data, or null if no game is in progress. A game
            is live from the moment it is started, so the first end reports a
            0-0 score. A live game that has had no score change for 120
            minutes is treated as abandoned and reported as null.

    Club:
      type: object
      required: [id, name, sheets]
      properties:
        id:
          type: string
          example: windy-city-curling
        name:
          type: string
          example: Windy City Curling
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/Sheet'
          description: All sheets, ordered by name.

    GameTeam:
      type: object
      required: [name, totalScore, hadLastStoneFirstEnd]
      properties:
        name:
          type: string
          description: >
            In a league game, the team's name. Otherwise the name of its rock
            color as the club had set it, which is not always Red or Yellow.
          example: Red
        color:
          allOf:
            - $ref: '#/components/schemas/RockColor'
          description: Absent on games recorded before colors were.
        teamId:
          type: string
          description: >
            League games only. The league team's ID, which stays the same if
            the team is renamed. See the Leagues endpoints.
          example: 4f9c2a71b3de
        externalId:
          type: string
          description: >
            League games only, and only when the club supplied one. The
            team's ID in the club's own league software.
          example: '1042'
        totalScore:
          type: integer
          minimum: 0
          example: 8
        hadLastStoneFirstEnd:
          type: boolean
          description: Whether this team had last stone (hammer) in end 1.

    End:
      type: object
      required: [endNumber, scoringTeam, score, gameTimeInSeconds]
      properties:
        endNumber:
          type: integer
          minimum: 1
          example: 3
        scoringTeam:
          type: [string, 'null']
          description: |
            Name of the team that scored, or null for a blank end. Ambiguous when
            both teams share a name, so prefer `scoringTeamSlot` when it is present.
          example: Red
        scoringTeamSlot:
          type: [string, 'null']
          enum: [team1, team2, null]
          description: |
            Which team scored, or null for a blank end. Absent on games recorded
            before this field was added.
          example: team1
        score:
          type: integer
          minimum: 0
          example: 2
        gameTimeInSeconds:
          type: integer
          minimum: -1
          description: |
            Elapsed game time at the end of this end, in seconds. -1 on ends recorded
            before the game clock existed.
          example: 1620

    Game:
      type: object
      required: [id, startedAt, finishedAt, numberOfEnds, league, bonspiel, team1, team2, ends]
      properties:
        id:
          type: string
          example: abc123xyz
        startedAt:
          type: string
          format: date-time
          example: '2024-01-15T19:00:00.000Z'
        finishedAt:
          type: string
          format: date-time
          example: '2024-01-15T21:00:00.000Z'
        numberOfEnds:
          type: integer
          example: 8
        league:
          oneOf:
            - $ref: '#/components/schemas/GameLeague'
            - type: 'null'
          description: Null for an open game, and for games recorded before leagues were.
        bonspiel:
          oneOf:
            - $ref: '#/components/schemas/GameBonspiel'
            - type: 'null'
          description: Null for a game that is not part of a bonspiel.
        team1:
          $ref: '#/components/schemas/GameTeam'
        team2:
          $ref: '#/components/schemas/GameTeam'
        ends:
          type: array
          items:
            $ref: '#/components/schemas/End'

    GameCompletedEvent:
      type: object
      required: [event, text, content, flags, allowed_mentions, club, sheet, game]
      properties:
        event:
          type: string
          enum: [game.completed]
        text:
          type: string
          description: The club's message, by default the result on one line. Slack shows this as the message.
          example: 'Monday Night, Sheet 1: Team Smith 7, Team Jones 4'
        content:
          type: string
          description: The same message as `text`. Discord shows this as the message.
          example: 'Monday Night, Sheet 1: Team Smith 7, Team Jones 4'
        flags:
          type: integer
          description: |
            Always 4096, Discord's `SUPPRESS_NOTIFICATIONS` flag, so the post
            notifies nobody, like an `@silent` message. Other receivers can ignore it.
          example: 4096
        allowed_mentions:
          type: object
          description: |
            Always `{"parse": []}`, so Discord ignores any `@everyone`, role or
            user mention in the club's message. Other receivers can ignore it.
          properties:
            parse:
              type: array
              items:
                type: string
              maxItems: 0
        club:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              example: windy-city-curling
            name:
              type: string
              example: Windy City Curling
        sheet:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              example: sheet-1
            name:
              type: string
              example: Sheet 1
        game:
          $ref: '#/components/schemas/Game'

webhooks:
  gameCompleted:
    post:
      summary: A game was completed
      description: |
        Sent to the club's webhook URL when Finish Game is tapped on one of its
        scoreboards. The club chooses in the admin portal whether every game is
        sent, only league games, where a league team was picked for at least
        one side, or only bonspiel games, which carry `game.bonspiel`.

        The URL must be `https` and publicly reachable. Any 2xx answer counts as
        delivered. No answer within 8 seconds, a 5xx or a 429 is tried twice
        more over a few seconds; anything else, including a redirect, is not
        tried again. A game is posted once, when the scoreboard's write arrives,
        so a scoreboard that was offline posts its games when it reconnects:
        use `game.finishedAt` for when the game ended.

        `text` and `content` hold the club's message, which it writes in the
        admin portal from variables such as the teams, scores, league and
        date. Read the fields of `game` rather than parsing the message.

        The admin portal's Send Test button posts `event: test` with `text`,
        `content`, `flags`, `allowed_mentions` and `club` only.
      operationId: gameCompleted
      tags: [Webhooks]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCompletedEvent'
      responses:
        '2XX':
          description: The result was received.

paths:
  /clubs/{clubId}:
    get:
      summary: Get club
      description: |
        Returns the club's name and all sheets, each with their current live game status.
        Useful for building an overview display of all sheets in a club.
      operationId: getClub
      tags: [Clubs]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
      responses:
        '200':
          description: Club found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/leagues:
    get:
      summary: List leagues
      description: |
        Returns the club's leagues, ordered by name, each with its weekly schedule and teams.
        Inactive leagues are included, with `active` set to false.
      operationId: listLeagues
      tags: [Leagues]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
      responses:
        '200':
          description: The club's leagues. Empty if it has none.
          content:
            application/json:
              schema:
                type: object
                required: [leagues]
                properties:
                  leagues:
                    type: array
                    items:
                      $ref: '#/components/schemas/League'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/leagues/{leagueId}:
    get:
      summary: Get league
      description: Returns a single league with its weekly schedule and teams.
      operationId: getLeague
      tags: [Leagues]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: leagueId
          in: path
          required: true
          description: Unique identifier for the league within the club.
          schema:
            type: string
          example: monday-night
      responses:
        '200':
          description: League found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/League'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or league not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/bonspiels:
    get:
      summary: List bonspiels
      description: Returns the club's bonspiels, newest first, inactive ones included.
      operationId: listBonspiels
      tags: [Bonspiels]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
      responses:
        '200':
          description: The club's bonspiels. Empty if it has none.
          content:
            application/json:
              schema:
                type: object
                required: [bonspiels]
                properties:
                  bonspiels:
                    type: array
                    items:
                      $ref: '#/components/schemas/BonspielSummary'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/bonspiels/{bonspielId}:
    get:
      summary: Get bonspiel
      description: |
        Returns a bonspiel with its events, teams, draws and games. Each game
        says where each side's team comes from, the team once it is known, and
        the score once it is played; each pool has its standings.
      operationId: getBonspiel
      tags: [Bonspiels]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: bonspielId
          in: path
          required: true
          description: Unique identifier for the bonspiel within the club.
          schema:
            type: string
          example: fall-spiel
      responses:
        '200':
          description: Bonspiel found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bonspiel'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or bonspiel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/sheets/{sheetId}:
    get:
      summary: Get sheet
      description: |
        Returns a single sheet and its current live game, if one is in progress.
        Poll this endpoint to drive a real-time scoreboard display for a specific sheet.
      operationId: getSheet
      tags: [Sheets]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: sheetId
          in: path
          required: true
          description: Unique identifier for the sheet within the club.
          schema:
            type: string
          example: sheet-1
      responses:
        '200':
          description: Sheet found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sheet'
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or sheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{clubId}/sheets/{sheetId}/games:
    get:
      summary: List completed games
      description: |
        Returns completed games for a sheet, ordered most-recent first.
        Use the `limit` parameter to control how many records are returned (default 20, max 100).
      operationId: listGames
      tags: [Games]
      parameters:
        - name: clubId
          in: path
          required: true
          description: Unique identifier for the club.
          schema:
            type: string
          example: windy-city-curling
        - name: sheetId
          in: path
          required: true
          description: Unique identifier for the sheet within the club.
          schema:
            type: string
          example: sheet-1
        - name: limit
          in: query
          required: false
          description: Maximum number of games to return. Clamped to the range 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        '200':
          description: List of completed games.
          content:
            application/json:
              schema:
                type: object
                required: [games, limit]
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                  limit:
                    type: integer
                    description: The effective limit that was applied.
                    example: 20
        '401':
          description: API key header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API key is not valid for this club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Club or sheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
