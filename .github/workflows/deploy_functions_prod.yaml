name: Deploy Functions - Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version Tag to Deploy
        required: true

jobs:
  deploy-functions-prod:
    runs-on: ubuntu-latest
    name: Deploy Functions - Prod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build
        working-directory: ./functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_PROD }}"

      # Keep the version in step with firebase-tools in emulator-tests.
      - name: Deploy Firestore and Functions
        working-directory: ${{ github.workspace }}
        run: npx firebase-tools@15.32.0 deploy --only firestore,functions --force --project curling-scoreboard-prod
