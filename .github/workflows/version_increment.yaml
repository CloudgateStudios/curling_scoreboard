name: Version Increment

on: workflow_dispatch

jobs:
  version_increment:
    name: Version Increment
    runs-on: ubuntu-latest

    steps:
      - name: Setup Action
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Setup git
        run: |
          git config --global user.name 'Build Bot'
          git config user.email bot@tomarra.com

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.9.8/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Install standard-version
        run: |
          sudo npm i -g standard-version standard-changelog

      - name: Generate release notes only
        run: |
          rm docs/RELEASE_NOTES.md && touch docs/RELEASE_NOTES.md
          standard-changelog -i docs/RELEASE_NOTES.md -o docs/RELEASE_NOTES.md -a false

      - name: Run standard-version
        run: standard-version

      - name: Get/Set Tag
        run: |
          export TAG=$(git describe --tags)
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Update version
        run: |
          yq eval '.version = "${{ env.tag }}"' -i app/pubspec.yaml
          (cd app && flutter packages get && flutter pub run build_runner build)
          git add app/pubspec.yaml
          git add docs/RELEASE_NOTES.md
          git add app/lib/src/version.dart
          git commit --amend --no-edit
          git tag -d "${{ env.tag }}"
          git tag "${{ env.tag }}"

      - name: Disable repository rulesets
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          mkdir -p /tmp/rulesets
          # Find all active rulesets and disable them temporarily
          gh api repos/${{ github.repository }}/rulesets \
            --jq '.[] | select(.enforcement == "active") | .id' | \
          while read id; do
            # Save the full ruleset so we can restore it exactly
            gh api repos/${{ github.repository }}/rulesets/$id > /tmp/rulesets/$id.json
            # Rebuild the payload with just the fields the PUT endpoint accepts, enforcement set to disabled
            jq '{name,target,enforcement: "disabled",bypass_actors,conditions,rules}' \
              /tmp/rulesets/$id.json | \
              gh api repos/${{ github.repository }}/rulesets/$id \
                --method PUT --input - > /dev/null
            echo "Disabled ruleset $id"
          done

      - name: Push changes
        run: |
          git push --follow-tags origin main
          git push --tags

      - name: Re-enable repository rulesets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Restore every ruleset we disabled
          for file in /tmp/rulesets/*.json; do
            [ -f "$file" ] || continue
            id=$(jq -r '.id' "$file")
            jq '{name,target,enforcement,bypass_actors,conditions,rules}' "$file" | \
              gh api repos/${{ github.repository }}/rulesets/$id \
                --method PUT --input - > /dev/null
            echo "Re-enabled ruleset $id"
          done

      - name: Setup Flutter Dependencies
        run: cd app && flutter pub get

      - name: Make Web Build Asset
        run: |
          (cd app && flutter build web -t lib/main.dart)
          zip -r web_${{ env.tag }}.zip app/build/web

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Google Services for Android
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/android/app/google-services.json

      - name: Make Android APK Build Asset
        run: |
          (cd app && flutter build apk --release)
          cp app/build/app/outputs/flutter-apk/app-release.apk app-release_${{ env.tag }}.apk

      - name: Make Android App Bundle Build Asset
        run: |
          (cd app && flutter build appbundle --release)
          cp app/build/app/outputs/bundle/release/app-release.aab app-release_${{ env.tag }}.aab

      - name: Make GitHub release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: docs/RELEASE_NOTES.md
          tag: ${{ env.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "web_${{ env.tag }}.zip,app-release_${{ env.tag }}.apk,app-release_${{ env.tag }}.aab"
