name: Version Increment

# Run by hand from the Actions tab. commit-and-tag-version bumps the version
# from the last tag by the chosen part and writes the changelog, then this
# copies the version into the app, builds the release assets, pushes the
# release commit and tag straight to main, and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version_increment:
    name: Version Increment
    runs-on: ubuntu-latest

    steps:
      # main only takes PRs. The release App is a bypass actor on the main
      # ruleset, so pushing with its token lands the release directly.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup Action
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: "0"
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # commit-and-tag-version is the maintained fork of the deprecated standard-version
      - name: Install release tooling
        run: |
          npm i -g commit-and-tag-version@13

      - name: Run commit-and-tag-version
        env:
          BUMP: ${{ inputs.bump }}
        run: commit-and-tag-version --release-as "$BUMP"

      # The release notes are the newest changelog section, which
      # commit-and-tag-version has just written with the new version in its
      # heading. Generating them separately left the version out, as there is
      # no package.json to read it from.
      - name: Write release notes
        run: awk '/^##+ \[/ { if (found) exit; found = 1 } found' docs/CHANGELOG.md > docs/RELEASE_NOTES.md

      - name: Get/Set Tag
        run: |
          export TAG=$(git describe --tags)
          echo "tag=$TAG" >> $GITHUB_ENV
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Update version
        run: |
          yq eval '.version = "${{ env.tag }}"' -i app/pubspec.yaml
          (cd app && flutter pub get && dart run build_runner build)
          git add app/pubspec.yaml
          git add docs/RELEASE_NOTES.md
          git add app/lib/src/version.dart
          git commit --amend --no-edit
          git tag -d "${{ env.tag }}"
          git tag "${{ env.tag }}"

      # Build every release asset before pushing so a failed build does not
      # leave a pushed version commit/tag without a GitHub release.
      - name: Setup Flutter Dependencies
        run: cd app && flutter pub get

      - name: Make Web Build Asset
        run: |
          (cd app && flutter build web --wasm -t lib/main.dart)
          zip -r web_${{ env.tag }}.zip app/build/web

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Google Services for Android
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/android/app/google-services.json

      - name: Make Android APK Build Asset
        run: |
          (cd app && flutter build apk --release)
          cp app/build/app/outputs/flutter-apk/app-release.apk app-release_${{ env.tag }}.apk

      - name: Make Android App Bundle Build Asset
        run: |
          (cd app && flutter build appbundle --release)
          cp app/build/app/outputs/bundle/release/app-release.aab app-release_${{ env.tag }}.aab

      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "refs/tags/${{ env.tag }}"

      - name: Make GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ env.tag }}" \
            --verify-tag \
            --title "${{ env.tag }}" \
            --notes-file docs/RELEASE_NOTES.md \
            "web_${{ env.tag }}.zip" \
            "app-release_${{ env.tag }}.apk" \
            "app-release_${{ env.tag }}.aab"
