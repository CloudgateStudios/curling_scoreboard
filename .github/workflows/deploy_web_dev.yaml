name: Deploy App - Web - Dev

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy App - Web - Dev
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: "stable"
      - run: flutter packages get
      - run: flutter build web -t lib/main.dart --dart-define=FIREBASE_ENV=dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
          projectId: curling-scoreboard-dev
          expires: 30d
          channelId: live
          entryPoint: ./app
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Function Dependencies
        run: cd functions && npm ci
      - name: Deploy Firestore and Functions
        run: npx firebase-tools@latest deploy --only firestore,functions --project curling-scoreboard-dev
