name: Deploy App - Web - Dev

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy App - Web - Dev
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: "stable"
      - run: flutter pub get
      # The commit SHA identifies this build. Scoreboards compare it with the
      # deployed one to know when to reload.
      - name: Set build ID
        run: echo "BUILD_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: flutter build web --wasm -t lib/main.dart --dart-define=FIREBASE_ENV=dev --dart-define=BUILD_ID=$BUILD_ID
      - name: Write build manifest
        run: echo "{\"buildId\":\"$BUILD_ID\"}" > build/web/build.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
          projectId: curling-scoreboard-dev
          expires: 30d
          channelId: live
          entryPoint: .
          target: app
      # Tell open scoreboards about the new build so they reload between games.
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
      - uses: google-github-actions/setup-gcloud@v3
      - name: Notify scoreboards of new build
        run: |
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/curling-scoreboard-dev/databases/(default)/documents/appConfig/scoreboard" \
            -d "{\"fields\":{\"buildId\":{\"stringValue\":\"$BUILD_ID\"},\"deployedAt\":{\"timestampValue\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}"
