name: Deploy Admin Portal - Dev

on:
  push:
    branches:
      - main

# Merges in quick succession must not deploy over each other. A queued run
# waits for the one in progress, and only the newest queued run is kept.
concurrency:
  group: deploy-admin-dev
  cancel-in-progress: false

jobs:
  deploy-admin-dev:
    runs-on: ubuntu-latest
    name: Deploy Admin Portal - Dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install admin portal dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build admin portal
        working-directory: ./admin
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
          projectId: curling-scoreboard-dev
          channelId: live
          target: admin
          entryPoint: .
          firebaseToolsVersion: 15.34.0
