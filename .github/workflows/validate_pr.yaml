name: "Validate PR"

on:
  pull_request:
    branches:
      - main

jobs:
  validate_pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            refactor
            test
            ci
            chore
            revert
          requireScope: false

  validate_spelling:
    name: Validate Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Check Spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: "**/*.{md,dart,ts,tsx,yaml,yml,html,css}"
          config: .github/cspell.json

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      scoreboard: ${{ steps.filter.outputs.scoreboard_any_changed }}
      functions: ${{ steps.filter.outputs.functions_any_changed }}
      admin: ${{ steps.filter.outputs.admin_any_changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter changed paths
        id: filter
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            scoreboard:
              - 'app/**'
            functions:
              - 'functions/**'
            admin:
              - 'admin/**'

  validate_scoreboard_app_code:
    name: Validate Scoreboard App Code
    needs: changes
    if: needs.changes.outputs.scoreboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - name: Get Flutter Packages
        run: flutter pub get
      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Build
        run: flutter build web -t lib/main.dart --dart-define=FIREBASE_ENV=dev
      - name: Test
        run: flutter test

  validate_scoreboard_strings:
    name: Validate Scoreboard String Usage
    needs: changes
    if: needs.changes.outputs.scoreboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - name: Setup Translations Cleaner
        run: flutter pub global activate translations_cleaner
      - name: Check For Unused Strings
        run: flutter pub run translations_cleaner list-unused-terms --abort-on-unused

  validate_functions:
    name: Validate Functions
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Build (TypeScript)
        run: npm run build

  validate_admin_app:
    name: Validate Admin App
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Type Check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
