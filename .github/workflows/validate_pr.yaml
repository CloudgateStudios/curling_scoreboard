name: "Validate PR"

on:
  pull_request:
    branches:
      - main

jobs:
  validate_pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            refactor
            test
            ci
            chore
            revert
          requireScope: false
  validate_scoreboard_app_code:
    name: Validate Scoreboard App Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: "stable"
      - name: Get Flutter Packages
        run: flutter pub get
      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Build
        run: flutter build web -t lib/main.dart --dart-define=FIREBASE_ENV=dev
      - name: Test
        run: flutter test
  validate_spelling:
    name: Validate Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Check Spelling
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: "**/*.{md,dart}"
          config: .github/cspell.json
  validate_strings:
    name: Validate String Usage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: "stable"
      - name: Setup Translations Cleaner
        run: flutter pub global activate translations_cleaner
      - name: Check For Unused Strings
        run: flutter pub run translations_cleaner list-unused-terms --abort-on-unused
  validate_functions:
    name: Validate Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/functions
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/functions/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Build (TypeScript)
        run: npm run build
  deploy_preview_to_firebase:
    needs:
      [
        validate_pr_title,
        validate_scoreboard_app_code,
        validate_spelling,
        validate_strings,
        validate_functions,
      ]
    name: Deploy Preview to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: "stable"
      - name: Get Flutter Packages
        run: flutter pub get
      - name: Build Web
        run: flutter build web -t lib/main.dart --dart-define=FIREBASE_ENV=dev
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Function Dependencies
        run: cd functions && npm ci
      - name: Build Functions
        run: cd functions && npm run build
      - name: Deploy Functions
        run: npx firebase-tools@latest deploy --only functions --project curling-scoreboard-dev
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"
          projectId: curling-scoreboard-dev
          expires: 10d
          channelId: "${{ steps.extract_branch.outputs.branch }}"
          entryPoint: ./app
