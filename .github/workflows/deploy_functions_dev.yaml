name: Deploy Functions - Dev

on:
  push:
    branches:
      - main

# Merges in quick succession must not deploy over each other. A queued run
# waits for the one in progress, and only the newest queued run is kept.
concurrency:
  group: deploy-functions-dev
  cancel-in-progress: false

jobs:
  deploy-functions-dev:
    runs-on: ubuntu-latest
    name: Deploy Functions - Dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build
        working-directory: ./functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_DEV }}"

      # Keep the version in step with firebase-tools in emulator-tests.
      - name: Deploy Firestore and Functions
        working-directory: ${{ github.workspace }}
        run: npx firebase-tools@15.34.0 deploy --only firestore,functions --force --project curling-scoreboard-dev
