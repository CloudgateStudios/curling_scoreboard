# Thin caller: hands Claude-related events to the shared workflow in CloudgateStudios/.github.
# The `if` filter keeps unrelated events from spending Actions minutes.

name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    uses: CloudgateStudios/.github/.github/workflows/claude-agent.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets: inherit
    # Optional per-repo overrides:
    # with:
    #   model: claude-sonnet-5-5
    #   max_turns: 25
