name: Deploy Admin Portal - Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version Tag to Deploy
        required: true

jobs:
  deploy-admin-prod:
    runs-on: ubuntu-latest
    name: Deploy Admin Portal - Prod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version }}

      # The Node version comes from the tag being deployed, but never below 24:
      # tags up to 0.3.0 say 22 in .nvmrc, or have none, and the portal in
      # the recent ones already needs 24 for the firebase web SDK.
      - name: Read Node version
        id: node
        run: |
          version=$(cat .nvmrc 2>/dev/null || echo 24)
          [ "$version" -ge 24 ] || version=24
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install admin portal dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build admin portal
        working-directory: ./admin
        env:
          VITE_ENV: prod
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURLING_SCOREBOARD_PROD }}'
          projectId: curling-scoreboard-prod
          channelId: live
          target: admin
          entryPoint: .
          firebaseToolsVersion: 15.34.0
